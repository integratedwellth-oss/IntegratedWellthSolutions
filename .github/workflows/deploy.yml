name: Deploy to Firebase
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Frontend Dependencies
        run: npm install --no-package-lock
      - name: Build Website
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      - name: Install Functions Dependencies
        run: cd functions && npm install --no-package-lock
      - name: Build Functions
        run: cd functions && npm run build
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Register DEEPSEEK_API_KEY in Firebase Secret Manager
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
          echo "${{ secrets.DEEPSEEK_API_KEY }}" | firebase functions:secrets:set DEEPSEEK_API_KEY --data-file=- --project integratedwellthsolutions --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
      - name: Deploy to Firebase Hosting and Functions
        uses: w9jds/firebase-action@v15.15.0
        with:
          args: deploy
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: integratedwellthsolutions
