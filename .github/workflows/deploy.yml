name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── ROOT: Frontend deps ───
      - name: Install root dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      # ─── FUNCTIONS: Backend deps ───
      - name: Install functions dependencies
        run: |
          cd functions
          rm -rf node_modules package-lock.json
          npm install

      # ─── FUNCTIONS: Build TypeScript → lib/index.js ───
      - name: Build Cloud Functions
        run: |
          cd functions
          npm run build

      # ─── ROOT: Build frontend ───
      - name: Build frontend
        run: npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.15.0
        with:
          args: deploy --only hosting,functions
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: integratedwellthsolutions
